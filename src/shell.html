:root{
/* Base palette (brand guide v1) */
--linen:#F5F3EF;
--white:#FFFFFF;
--stone:#D6D2CC;
--espresso:#1F1B18;
--pale-oak:#D8C4A6;
--muted-olive:#6F745F;
/* Derived tints (oklch mixes of the palette; use sparingly) */
--espresso-80:#4A4541;
--espresso-60:#6B6661;
--olive-dark:#585C4B;
--linen-deep:#EDE9E2;
/* Third-party */
--pinterest-red:#E60023;

/* Semantic aliases */
--surface-page:var(--linen);
--surface-card:var(--white);
--surface-image:var(--white);
--surface-inverse:var(--espresso);
--surface-muted:var(--linen-deep);
--text-primary:var(--espresso);
--text-secondary:var(--espresso-80);
--text-muted:var(--espresso-60);
--text-inverse:var(--linen);
--text-link:var(--muted-olive);
--text-link-hover:var(--espresso);
--text-tag:var(--muted-olive);
--border-hairline:var(--stone);
--border-strong:var(--espresso);
--accent:var(--pale-oak);
--accent-rule:var(--pale-oak);
--focus-ring:var(--muted-olive);
--button-primary-bg:var(--espresso);
--button-primary-fg:var(--linen);
--button-primary-bg-hover:var(--espresso-80);
--button-secondary-fg:var(--espresso);
--button-secondary-border:var(--espresso);
--button-secondary-bg-hover:var(--pale-oak);
}

:root{
--font-display:'Libre Caslon Display',Georgia,'Times New Roman',serif;
--font-accent:'Libre Caslon Text',Georgia,serif;
--font-sans:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;

--weight-light:300;
--weight-regular:400;
--weight-medium:500;

/* Display scale — mobile first; desktop values in -lg */
--text-h1:38px;--text-h1-lg:60px;
--text-h2:30px;--text-h2-lg:40px;
--text-h3:22px;--text-h3-lg:26px;
--text-h4:19px;
--text-body-lg:17px;
--text-body:15px;
--text-small:13px;
--text-label:11px;
--text-label-lg:12px;

--leading-display:1.08;
--leading-heading:1.18;
--leading-body:1.7;
--leading-ui:1.3;

--tracking-display:-0.005em;
--tracking-label:0.2em;
--tracking-button:0.15em;
--tracking-wordmark:0.3em;
--tracking-pin-label:0.25em;
}

:root{
--space-1:4px;
--space-2:8px;
--space-3:12px;
--space-4:16px;
--space-5:24px;
--space-6:32px;
--space-7:48px;
--space-8:64px;
--space-9:96px;
--space-10:128px;

--gutter:20px;--gutter-lg:40px;
--section-gap:64px;--section-gap-lg:112px;
--content-max:1200px;
--prose-max:640px;
--header-height:64px;

--radius-0:0;
--radius-1:2px;
--radius-2:4px; /* max radius in the system */

--hairline:1px solid var(--stone);
--rule-oak:1px solid var(--pale-oak);
--shadow-none:none;
--shadow-lift:0 1px 2px rgba(31,27,24,.06); /* only for floating Save button */

--ease-out:cubic-bezier(.2,.6,.2,1); /* @kind other */
--dur-fast:150ms; /* @kind other */
--dur-base:240ms; /* @kind other */
--dur-slow:400ms; /* @kind other */

--ratio-pin:2/3; /* @kind other */
--ratio-product:1/1; /* @kind other */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans);font-weight:var(--weight-light);font-size:var(--text-body);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--text-link);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--text-link-hover);text-decoration-color:var(--pale-oak)}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:400;letter-spacing:var(--tracking-display);margin:0;text-wrap:balance}
p{margin:0;text-wrap:pretty}
:focus-visible{outline:1px solid var(--focus-ring);outline-offset:3px}
::selection{background:var(--pale-oak);color:var(--espresso)}
.tms-h1{font-family:var(--font-display);font-size:var(--text-h1);line-height:var(--leading-display)}
.tms-h2{font-family:var(--font-display);font-size:var(--text-h2);line-height:var(--leading-heading)}
.tms-h3{font-family:var(--font-display);font-size:var(--text-h3);line-height:var(--leading-heading)}
@media (min-width:900px){.tms-h1{font-size:var(--text-h1-lg)}.tms-h2{font-size:var(--text-h2-lg)}.tms-h3{font-size:var(--text-h3-lg)}}
.tms-label{font-family:var(--font-sans);font-weight:500;font-size:var(--text-label);letter-spacing:var(--tracking-label);text-transform:uppercase;line-height:var(--leading-ui)}
.tms-accent{font-family:var(--font-accent);font-style:italic}
.tms-body{font-family:var(--font-sans);font-weight:300;font-size:var(--text-body);line-height:var(--leading-body)}

</style>

.prose{max-width:var(--prose-max);margin:0 auto;font-size:16px;line-height:1.8}

.guide{font-size:16px;line-height:1.8;color:var(--text-primary);min-width:0}

.about{display:grid;gap:40px;max-width:960px;margin:0 auto;align-items:center}
@media(min-width:800px){.about{grid-template-columns:1fr 1fr;gap:72px}}
